name: Verify publication
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.8.3'
          python-version: '3.12.11'
      - run: uv sync --frozen --group plots
      - run: uv run python scripts/verify.py
      - run: uv run --group plots python scripts/render.py
      - run: uv run python scripts/verify.py
      - name: Install pinned Gitleaks for the secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Secret scan of the public projection (release gate)
        run: uv run python scripts/scan_secrets.py
      - name: Secret scan of the full candidate history
        run: |
          # R04: the history gate needs the complete history, not the default
          # depth-1 checkout; refuse to run against a shallow clone.
          if git rev-parse --is-shallow-repository | grep -qx true; then
            echo "History scan requires the full history (fetch-depth: 0)."
            exit 1
          fi
          # The projection gate applies the same reviewed, content-bound
          # exception policy to history findings: anything outside the
          # reviewed test fixtures stops the build, in either scan.
          uv run python scripts/scan_secrets.py --history .
      - run: git diff --exit-code -- results docs assets README.md
