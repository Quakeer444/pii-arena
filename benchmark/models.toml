[variants.sent300]
env = { CHUNK = "300", CHUNK_MODE = "sent" }
benches = ["secrets-issues", "tab-echr", "dialogpii-en", "nerel", "factrueval", "synth-ru-tickets", "redact-ru", "nemotron-pii", "jayguard", "creddata", "leak-museum"]
