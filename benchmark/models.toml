[variants.nochunk]
env = { CHUNK = "0" }
benches = ["secrets-issues", "tab-echr", "dialogpii-en", "nerel", "factrueval", "synth-ru-tickets", "redact-ru", "nemotron-pii", "jayguard", "creddata", "leak-museum"]
models = ["gliner25-fastino", "gliner25-fastino-ru", "mmbert32k"]

[variants.homoglyph]
env = { NORMALIZE = "homoglyph" }
benches = ["corrupt-hivetrace", "corrupt-redmadrobot", "corrupt-secrets-issues"]
models = ["pplx", "gliner-nvidia", "opf-ru-v2", "ru-legal-ner", "gliner2-vladlinv", "nym-base", "ner-ru-gherman"]

[cpu]
benches = ["hivetrace", "redmadrobot", "nym-ru", "synth-ru-tickets", "secrets-issues", "ameau01", "nemotron-pii", "tab-echr", "kiji-multi"]
