  <text x="64" y="174" fill="#f3f6fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="720" letter-spacing="-1.4">PII &amp; Secrets Detector Benchmark</text>
  <text x="64" y="224" fill="#9daabd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="22">The independent benchmark for PII and secret detectors.</text>

