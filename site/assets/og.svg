<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title description">
  <title id="title">PII Arena detector leaderboard</title>
  <desc id="description">The independent benchmark for PII and secret detectors, with the leading detector results from the frozen September 2026 snapshot.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="0.62" stop-color="#0a1519"/>
      <stop offset="1" stop-color="#0b2b29"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#223043"/>

