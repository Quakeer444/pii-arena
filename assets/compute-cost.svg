  <g id="text_34">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #50647a" transform="translate(33.264 413.428219)">CPU: AMD EPYC 9K84, W=24, 16 threads per process; calibrated to PPLX at 1,100 chars/s. GPU: W=2.</text>
