  <g id="text_33">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #50647a" transform="translate(33.264 532.37025)">These are annotation units, not distinct people or unique credentials. Nested and differently labeled annotations remain separate.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #50647a" transform="translate(33.264 542.448281)">Category families are an explanatory grouping, not a legal determination that every occurrence is personal data.</text>
